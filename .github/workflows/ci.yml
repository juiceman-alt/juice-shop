name: "AppSec Lab CI"

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appsec-lab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  NODE_OPTIONS: "--max_old_space_size=4096"

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund

      - name: Lint source code
        run: npm run lint

      - name: Build application
        run: npm run build

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund

      - name: Run frontend unit tests
        run: npm run test:frontend:coverage

  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked server dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run server unit tests
        run: npm run test:server:coverage

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Run deterministic API tests
        shell: bash
        run: |
          mapfile -t tests < <(find test/api -name '*.test.ts' ! -name 'internet-resources.test.ts' -print)
          node --import ./test/server/helpers/test-env.mjs --import tsx \
            --test --test-force-exit "${tests[@]}"

  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build container image
        run: docker build --tag juice-shop-appsec-lab:${{ github.sha }} .

      - name: Start container
        run: |
          docker run --detach --name juice-shop-ci \
            --publish 127.0.0.1:3000:3000 \
            juice-shop-appsec-lab:${{ github.sha }}

      - name: Verify application health
        shell: bash
        run: |
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            docker logs juice-shop-ci
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -q '<app-root></app-root>'
          curl --fail --silent --show-error http://127.0.0.1:3000/api/Challenges | grep -q '"status":"success"'

      - name: Show container logs on failure
        if: failure()
        run: docker logs juice-shop-ci

      - name: Stop container
        if: always()
        run: docker rm --force juice-shop-ci || true

  required-ci-gate:
    name: Required CI Gate
    if: always()
    needs:
      - quality
      - frontend-tests
      - server-tests
      - api-tests
      - container-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        shell: bash
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.frontend-tests.result }}" = "success"
          test "${{ needs.server-tests.result }}" = "success"
          test "${{ needs.api-tests.result }}" = "success"
          test "${{ needs.container-smoke.result }}" = "success"
